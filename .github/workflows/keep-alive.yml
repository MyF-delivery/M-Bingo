name: Keep Render Services Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend API (Wake up server)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: m-bingo-keepalive/1.0" \
            https://m-bingo-backend.onrender.com/health || echo "000")
          echo "Backend responded: $code"

      - name: Ping Bot Service (Wake up bot)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: m-bingo-keepalive/1.0" \
            https://m-bingo-bot.onrender.com/ || echo "000")
          echo "Bot responded: $code"

      - name: Ping Frontend (Keep CDN warm)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "User-Agent: m-bingo-keepalive/1.0" \
            https://myf-delivery.github.io/M-Bingo/ || echo "000")
          echo "Frontend responded: $code"
