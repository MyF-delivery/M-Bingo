name: Keep Render Services Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows you to manually run it from the Actions tab for testing
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend API (Wake up server)
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://m-bingo-backend.onrender.com/health || true
      
      - name: Ping Bot Service (Wake up bot)
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://m-bingo-bot.onrender.com/ || true
          
      - name: Ping Frontend (Keep CDN warm)
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://myf-delivery.github.io/M-Bingo/ || true
